<!-- AdSense Responsive Ad Unit Container -->
<div class="my-8 mx-auto max-w-4xl text-center overflow-hidden">
  <div class="inline-block w-full bg-gray-900/40 border border-gray-800/60 rounded-xl p-3 min-h-[90px] flex items-center justify-center">
    {% if site and site.adsense_client_id and site.adsense_slot_id %}
      <!-- Live AdSense Code -->
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="{{ site.adsense_client_id }}"
           data-ad-slot="{{ site.adsense_slot_id }}"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    {% else %}
      <!-- Clean Placeholder (Hidden in Production unless configured) -->
      <span class="text-xs font-semibold text-gray-600 uppercase tracking-widest">
        Advertisement
      </span>
    {% endif %}
  </div>
</div>
