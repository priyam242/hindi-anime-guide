name: Schedule 2-Hour Airing Sync

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: schedule-sync-group
  cancel-in-progress: false

jobs:
  sync-airing-schedule:
    name: Sync AniList Weekly Airing Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Warm & Refresh Airing Schedule Cache
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "from automation.fetchers.anilist import fetch_live_weekly_schedule; res = fetch_live_weekly_schedule(force_refresh=True); print(f'Successfully refreshed weekly schedule cache with {len(res)} days.')"
          python automation/run_all.py --source schedule --limit 10

      - name: Pre-warm public pages
        if: always()
        run: |
          SITE="${{ secrets.SITE_BASE_URL || secrets.SITE_URL }}"
          if [ -n "$SITE" ]; then
            echo "Pre-warming public pages on $SITE..."
            curl -sSf "${SITE}/" > /dev/null || true
            curl -sSf "${SITE}/schedule" > /dev/null || true
            curl -sSf "${SITE}/manga" > /dev/null || true
            curl -sSf "${SITE}/awards" > /dev/null || true
          fi

