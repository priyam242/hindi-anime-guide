name: Content Automation Pipeline

on:
  schedule:
    # Run every 3 hours at minute 0 (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to execute (all, anilist, livechart, manga)'
        required: false
        default: 'all'
      limit:
        description: 'Item limit per source'
        required: false
        default: '10'

# Concurrency group ensures two scheduled or manual runs never execute concurrently
concurrency:
  group: content-automation-fetch
  cancel-in-progress: false

jobs:
  fetch-and-stage:
    name: Fetch & Stage Anime Drafts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Content Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          PYTHONUNBUFFERED: "1"
        run: |
          SOURCE_FLAG="${{ github.event.inputs.source || 'all' }}"
          LIMIT_FLAG="${{ github.event.inputs.limit || '10' }}"
          python automation/run_all.py --source "$SOURCE_FLAG" --limit "$LIMIT_FLAG"
