name: News & Trailers 3-Hour Sync

on:
  schedule:
    # Run every 3 hours at minute 0 (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Item limit'
        required: false
        default: '12'

concurrency:
  group: news-trailers-sync-group
  cancel-in-progress: false

jobs:
  sync-news-and-trailers:
    name: Sync Editorial News & Official Trailers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch & Stage News RSS + Official Trailers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          LIMIT_VAL="${{ github.event.inputs.limit || '12' }}"
          python automation/run_all.py --source news,trailers --limit "$LIMIT_VAL"

      - name: Pre-warm public pages
        if: always()
        run: |
          SITE="${{ secrets.SITE_BASE_URL || secrets.SITE_URL }}"
          if [ -n "$SITE" ]; then
            echo "Pre-warming public pages on $SITE..."
            curl -sSf "${SITE}/" > /dev/null || true
            curl -sSf "${SITE}/schedule" > /dev/null || true
            curl -sSf "${SITE}/manga" > /dev/null || true
            curl -sSf "${SITE}/awards" > /dev/null || true
          fi

